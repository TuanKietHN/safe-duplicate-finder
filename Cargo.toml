[workspace]
resolver = "3"
members = [
    "crates/dedupe-core",
    "crates/dedupe-store",
    "crates/dedupe-platform",
    "crates/dedupe-report",
    "crates/dedupe-testkit",
    "apps/cli",
    "apps/desktop/src-tauri",
    "apps/runtime-installer",
    "benchmarks",
]

[workspace.package]
version = "0.2.1"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
authors = ["Safe Duplicate Finder contributors"]

[workspace.dependencies]
anyhow = "1.0"
blake3 = "1.8"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
crossbeam-channel = "0.5"
csv = "1.3"
globset = "0.4"
hex = "0.4"
html-escape = "0.2"
libc = "0.2"
parking_lot = "0.12"
rusqlite = { version = "0.40", features = ["bundled", "chrono", "uuid", "serde_json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
tempfile = "3.20"
thiserror = "2.0"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
unicode-normalization = "0.1"
uuid = { version = "1.17", features = ["v4", "serde"] }
walkdir = "2.5"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
needless_pass_by_value = "allow"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
overflow-checks = true
panic = "abort"
