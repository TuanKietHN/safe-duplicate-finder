name: safety-gates

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-targets --all-features
      - run: cargo install cargo-deny --locked --version 0.20.2
      - run: cargo deny check -A warnings
      - run: cargo install cargo-audit --locked --version 0.22.2
      - run: cargo audit
      - run: npm ci
        working-directory: apps/desktop
      - run: npm run lint
        working-directory: apps/desktop
      - run: npm run test
        working-directory: apps/desktop
      - run: npm run build
        working-directory: apps/desktop
      - run: npm run format:check
        working-directory: apps/desktop
      - run: npm audit --audit-level=high
        working-directory: apps/desktop

  portable-cli:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - run: cargo test -p dedupe-core -p dedupe-store -p dedupe-platform -p dedupe-report -p safe-dedupe
      - run: docker build --tag safe-dedupe:test .
